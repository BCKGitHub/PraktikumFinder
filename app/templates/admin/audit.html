{% extends "admin/base_admin.html" %}
{% block admin %}
<h1>Protokoll</h1>
<table class="table small"><thead><tr><th>Zeit (UTC)</th><th>Wer</th><th>Aktion</th><th>Objekt</th><th>Details</th></tr></thead><tbody>
{% for a in items %}<tr><td>{{ a.at|fmt_date }}</td><td>{{ a.actor }}</td><td>{{ a.action }}</td><td>{{ a.entity or "" }} {{ a.entity_id or "" }}</td><td><code>{{ a.details|tojson }}</code></td></tr>
{% else %}<tr><td colspan="5">Noch keine Einträge.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
