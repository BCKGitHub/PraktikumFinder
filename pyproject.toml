[project]
name = "praktikumfinder"
version = "0.1.0"
description = "Schülerpraktika finden – passend zu Bereich, Alter, Schulterminen und Weg."
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "B008"]
per-file-ignores = { "app/appsupport.py" = ["E501"], "app/seed.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
